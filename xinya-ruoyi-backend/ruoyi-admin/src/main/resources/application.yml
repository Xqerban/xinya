server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: xinya-ruoyi-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xinya_dtx}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:xinya}
    password: ${DB_PASS:xinya}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    ignore-migration-patterns: "*:missing"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      # 业务表 id-type 由各 Entity @TableId 注解指定（INPUT 或 AUTO），此处不影响
      id-type: INPUT
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 自定义配置（JWT / AI服务 / Internal API Key）
xinya:
  auth:
    jwt-secret: ${JWT_SECRET:xinya-ruoyi-jwt-secret-key-2024-please-change-in-production}
    access-token-exp-seconds: 7200
    refresh-token-exp-seconds: 604800
  ai:
    psych-base-url: ${AI_PSYCH_URL:http://localhost:8001}
    nurse-base-url: ${AI_NURSE_URL:http://localhost:8443}
  internal:
    api-key: ${INTERNAL_API_KEY:dev-internal-key}

logging:
  level:
    com.xinya: INFO
    com.baomidou.mybatisplus: WARN

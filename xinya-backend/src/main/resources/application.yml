spring:
  application:
    name: xinya-dtx-backend
  
  profiles:
    active: dev
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  # Flyway配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /

# OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 应用配置
xinya:
  ai:
    enabled: false
    provider: openai-compatible
    base-url: https://api.openai.com/v1
    api-key: ${AI_API_KEY:demo-key}
    model: gpt-4
    timeout: 30000

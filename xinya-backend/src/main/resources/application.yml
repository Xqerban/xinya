spring:
  application:
    name: xinya-dtx-backend
  datasource:
    url: jdbc:mysql://localhost:3306/xinya_dtx?characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: xinya
    password: xinya
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
  
  profiles:
    active: dev
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  # Flyway默认关闭，由各环境按需开启
  flyway:
    enabled: false

# 服务器配置
server:
  port: 8081
  servlet:
    context-path: /

# OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 应用配置
xinya:
  ai:
    api-key: ${AI_API_KEY:sk-9895d0792ac243a997fd9a56dafaf0b1}
    psych-base-url: http://localhost:8001
    nurse-base-url: http://localhost:8443

  auth:
    # JWT 密钥，生产环境请通过环境变量 JWT_SECRET 配置为足够复杂的随机串
    jwt-secret: ${JWT_SECRET:dev-secret-change-me}
    # accessToken 默认 15 分钟
    access-token-exp-seconds: 900
    # refreshToken 默认 7 天
    refresh-token-exp-seconds: 604800

  internal:
    # 内部服务间通信密钥，生产环境请通过环境变量 INTERNAL_API_KEY 配置
    api-key: ${INTERNAL_API_KEY:dev-internal-key}

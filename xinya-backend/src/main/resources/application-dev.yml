spring:
  # 开发环境使用H2内存数据库
  datasource:
    url: jdbc:h2:mem:xinyadt;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  flyway:
    enabled: false

# 开发环境日志
logging:
  level:
    com.xinya: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
